<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container flex justify-center align-center">
      <div class="hero">
        <div class="navigation flex justify-between">
          <div class="logo">
            <img
              src="./images/logo 1.svg"
              alt="logo"
              width="100px"
              height="34px"
            />
          </div>
          <div class="action_container flex justify-between">
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>

            <img
              class="user"
              src="./images/user (1).png"
              alt="vector"
              width="20px"
              height="20px"
            />
          </div>
          <div class="en">
            <p>EN</p>
          </div>
        </div>
        <div class="text">
          <p class="t1">PURE MAGIC</p>
          <p class="t2">AWAITS!</p>
          <p class="t3">2024</p>
        </div>
      </div>
      <div class="location flex justify-center align-center">
        <div class="overlay">
          <div class="card flex justify-center align-center c1">
            <p class="w1">TERKHIIN TSAGAAN LAKE</p>
          </div>
        </div>
        <div class="overlay">
          <div class="card c2 flex justify-center align-center">
            <p class="w1">AMARBAYASGALANT MONASTERY</p>
          </div>
        </div>
        <div class="overlay">
          <div class="card c3 flex justify-center align-center">
            <p class="w1">KHUVSGUL LAKE</p>
          </div>
        </div>

        <div class="overlay">
          <div class="card c4 flex justify-center align-center">
            <p class="w1">KHORGIIN TOGOO</p>
          </div>
        </div>
      </div>
      <div class="roadmap flex justify-center align-center">
        <div class="head flex justify-center align-center">
          <p class="te1">Destination of Our Agency</p>
          <p class="te2">Pack Your Bags And Get Ready</p>
        </div>
        <div class="name flex">
          <div class="day1"></div>
          <div class="day2"></div>
          <div class="day3"></div>
          <div class="day4"></div>
          <div class="day5"></div>
        </div>
      </div>
      <div class="footer"></div>
    </div>
  </body>
</html>
