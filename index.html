<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container flex justify-center align-center">
      <div class="hero">
        <div class="navigation flex justify-between">
          <div class="logo">
            <img src="./logo 1.svg" alt="logo" width="100px" height="34px" />
          </div>
          <div class="action_container flex justify-between">
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>

            <img
              class="user"
              src="./user (1).png"
              alt="vector"
              width="20px"
              height="20px"
            />
          </div>
          <div class="en">
            <p>EN</p>
          </div>
        </div>
        <div class="text">
          <p style="font-size: 80px">PURE MAGIC</p>
          <p style="font-size: 250px">AWAITS!</p>
          <p style="font-size: 64px">2024</p>
        </div>
      </div>
      <div class="location">
        <div class="card">
          <p>TERKHIIN TSAGAAN LAKE</p>
        </div>
        <div class="card">
          <p>AMARBAYASGALANT MONASTERY</p>
        </div>
        <div class="card">
          <p>KHUVSGUL LAKE</p>
        </div>
        <div class="card">
          <p>KHORGIIN TOGOO</p>
        </div>
      </div>
      <div class="roadmap"></div>
      <div class="footer"></div>
    </div>
  </body>
</html>
